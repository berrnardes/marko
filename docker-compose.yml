# Stack always-on do Hetzner: Postgres + PgBouncer + WAHA + worker + Caddy.
#
# O app Next.js NÃO está aqui — ele é hospedado na Vercel. Esta máquina roda o
# que a Vercel não consegue manter de pé: o banco (Postgres), o pooler público
# para o app serverless (PgBouncer), o WAHA (gateway WhatsApp contínuo), o
# worker (consumidor contínuo da fila pg-boss) e o backup noturno do banco.
#
# Topologia do banco (espelha o split que existia no Supabase):
#   app Vercel ──TLS──▶ pgbouncer:5432 (público, transaction mode) ─▶ postgres
#   worker     ────────▶ postgres:5432 (rede Docker, direto — o pg-boss precisa
#                        de afinidade de sessão e NÃO pode passar pelo pooler
#                        de transação)
#
# Os dois serviços ficam na mesma rede Docker, então o worker fala com o WAHA
# pelo hostname interno `waha` (http://waha:3000) — sem expor essa porta à
# internet além do necessário.
#
# Suba com:  docker compose --env-file .env.production up -d --build

services:
  # Banco de dados da aplicação (leads, mensagens, Better Auth, fila pg-boss).
  # NÃO publica porta no host: o acesso externo entra só pelo PgBouncer; o
  # worker e o backup falam com ele pela rede Docker interna.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=marko
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=marko
      # Consistência de exibição (logs, now() em sessões psql). O armazenamento
      # de `timestamptz` é UTC internamente e independe disto — a lógica de
      # negócio de fuso vive nos processos Node (ver TZ do worker).
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marko -d marko"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - marko

  # Entrada PÚBLICA do banco para o app serverless na Vercel: pooling em modo
  # transação (uma função serverless não pode segurar conexões) + TLS com
  # certificado autoassinado (por isso o app usa `?sslmode=no-verify`).
  # Gere o certificado antes do primeiro `up` (ver docs/db-migration-*.md):
  #   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
  #     -keyout certs/db.key -out certs/db.crt -subj "/CN=db.markohome.com.br"
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=marko
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=marko
      - LISTEN_PORT=5432
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - CLIENT_TLS_SSLMODE=require
      - CLIENT_TLS_KEY_FILE=/certs/db.key
      - CLIENT_TLS_CERT_FILE=/certs/db.crt
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - marko

  # Backup noturno: pg_dump para o volume local (retenção de N dias) e, se
  # RCLONE_REMOTE estiver configurado no .env.production, cópia offsite
  # (Hetzner Storage Box via SFTP ou qualquer S3-compatível via RCLONE_CONFIG_*).
  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=marko
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=marko
      - BACKUP_KEEP_DAYS=14
    volumes:
      - pg-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - marko

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    # NÃO publica a 3000 na internet: o acesso externo (app da Vercel) entra
    # pelo Caddy via HTTPS (https://waha.markohome.com.br). O worker continua
    # falando com o WAHA pelo hostname interno `waha:3000` da rede Docker.
    # `expose` deixa a porta visível só entre containers, sem mapear no host.
    expose:
      - "3000"
    # Carrega as credenciais persistentes do dashboard/swagger (e demais
    # WAHA_*) do arquivo de produção. Sem isso, o WAHA gera senhas aleatórias
    # de dashboard/swagger a cada restart (ver logs) e o /dashboard responde
    # 401 com a senha antiga.
    env_file:
      - .env.production
    environment:
      # Chave de API do WAHA (mesma que o worker usa em WAHA_API_KEY).
      # ATENÇÃO: o WAHA atual lê WAHA_API_KEY. Se essa variável não estiver
      # definida, o WAHA gera uma chave aleatória no startup (ver logs) e
      # rejeita a sua com 401. Mantemos WHATSAPP_API_KEY por retrocompat.
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      # Para onde o WAHA entrega os eventos inbound: o webhook do app na Vercel.
      - WHATSAPP_HOOK_URL=${WAHA_WEBHOOK_URL}
      - WHATSAPP_HOOK_EVENTS=message
    volumes:
      # Persiste a sessão autenticada (QR code) entre reinícios do container.
      - waha-sessions:/app/.sessions
    # Rotaciona os logs para o disco do Hetzner não encher (o WAHA é verboso).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - marko

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    # Carrega DATABASE_URL, WAHA_*, BETTER_AUTH_*, etc. do arquivo de produção.
    env_file:
      - .env.production
    environment:
      # Sobrescreve o endereço do WAHA para o hostname interno da rede Docker,
      # independentemente do que estiver no .env.production.
      - WAHA_BASE_URL=http://waha:3000
      # Banco LOCAL (container postgres), direto e sem pooler: o pg-boss exige
      # afinidade de sessão. Sobrescreve qualquer DATABASE_URL do .env.production.
      - DATABASE_URL=postgres://marko:${POSTGRES_PASSWORD}@postgres:5432/marko
      # Identifica este processo nos logs estruturados (campo `svc`) e força o
      # logger a emitir JSON puro (sem pino-pretty) para agregação.
      - SVC=worker
      - NODE_ENV=production
      # CRÍTICO: o servidor fica na Alemanha (UTC no container), mas TODA a
      # lógica de "hora do dia" do domínio usa o fuso LOCAL do processo: janela
      # de envio 9h–20h (core/anti-ban.ts), virada do contador diário anti-ban
      # (number-repository.ts) e contagem de dias do warm-up. Sem isso, a janela
      # rodaria 06h–17h no Brasil e o contador diário viraria às 21h, dobrando o
      # volume diário de um número dentro do mesmo dia brasileiro (risco de ban).
      # Fuso NOMEADO (não offset): o Brasil aboliu o horário de verão, a
      # Alemanha não — a diferença oscila entre 4h e 5h ao longo do ano.
      - TZ=America/Sao_Paulo
    depends_on:
      waha:
        condition: service_started
      postgres:
        condition: service_healthy
    # Rotaciona os logs JSON do worker para o disco do Hetzner não encher: no
    # máximo 5 arquivos de 10 MB por serviço.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - marko

  # Proxy reverso com TLS automático (Let's Encrypt) na frente do WAHA. Publica
  # https://waha.markohome.com.br e encaminha para `waha:3000` na rede interna.
  # É o ÚNICO container com portas abertas na internet (80/443). O 80 é exigido
  # pelo desafio ACME; o 443 serve o tráfego. Requer:
  #   - registro DNS A: waha.markohome.com.br -> IP público do Hetzner
  #   - firewall do Hetzner liberando 80 e 443
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Rotaciona os logs para o disco do Hetzner não encher.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - waha
    networks:
      - marko

volumes:
  # Dados do Postgres — o banco inteiro vive aqui. NUNCA rode `docker compose
  # down -v` em produção.
  pg-data:
  # Dumps noturnos do banco (retenção local; offsite via rclone).
  pg-backups:
  waha-sessions:
  # Persiste os certificados TLS do Caddy entre restarts (evita re-emitir e
  # bater no rate limit do Let's Encrypt).
  caddy-data:
  caddy-config:

networks:
  marko:
    driver: bridge
