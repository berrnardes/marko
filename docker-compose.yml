# Stack always-on do Hetzner: WAHA (gateway WhatsApp) + worker (fila pg-boss).
#
# O app Next.js NÃO está aqui — ele é hospedado na Vercel. Esta máquina roda os
# dois processos que a Vercel não consegue manter de pé: o WAHA (serviço
# contínuo) e o worker (consumidor contínuo da fila no Postgres do Supabase).
#
# Os dois serviços ficam na mesma rede Docker, então o worker fala com o WAHA
# pelo hostname interno `waha` (http://waha:3000) — sem expor essa porta à
# internet além do necessário.
#
# Suba com:  docker compose --env-file .env.production up -d --build

services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    # NÃO publica a 3000 na internet: o acesso externo (app da Vercel) entra
    # pelo Caddy via HTTPS (https://waha.markohome.com.br). O worker continua
    # falando com o WAHA pelo hostname interno `waha:3000` da rede Docker.
    # `expose` deixa a porta visível só entre containers, sem mapear no host.
    expose:
      - "3000"
    # Carrega as credenciais persistentes do dashboard/swagger (e demais
    # WAHA_*) do arquivo de produção. Sem isso, o WAHA gera senhas aleatórias
    # de dashboard/swagger a cada restart (ver logs) e o /dashboard responde
    # 401 com a senha antiga.
    env_file:
      - .env.production
    environment:
      # Chave de API do WAHA (mesma que o worker usa em WAHA_API_KEY).
      # ATENÇÃO: o WAHA atual lê WAHA_API_KEY. Se essa variável não estiver
      # definida, o WAHA gera uma chave aleatória no startup (ver logs) e
      # rejeita a sua com 401. Mantemos WHATSAPP_API_KEY por retrocompat.
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      # Para onde o WAHA entrega os eventos inbound: o webhook do app na Vercel.
      - WHATSAPP_HOOK_URL=${WAHA_WEBHOOK_URL}
      - WHATSAPP_HOOK_EVENTS=message
    volumes:
      # Persiste a sessão autenticada (QR code) entre reinícios do container.
      - waha-sessions:/app/.sessions
    # Rotaciona os logs para o disco do Hetzner não encher (o WAHA é verboso).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - marko

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    # Carrega DATABASE_URL, WAHA_*, BETTER_AUTH_*, etc. do arquivo de produção.
    env_file:
      - .env.production
    environment:
      # Sobrescreve o endereço do WAHA para o hostname interno da rede Docker,
      # independentemente do que estiver no .env.production.
      - WAHA_BASE_URL=http://waha:3000
      # Identifica este processo nos logs estruturados (campo `svc`) e força o
      # logger a emitir JSON puro (sem pino-pretty) para agregação.
      - SVC=worker
      - NODE_ENV=production
    depends_on:
      - waha
    # Rotaciona os logs JSON do worker para o disco do Hetzner não encher: no
    # máximo 5 arquivos de 10 MB por serviço.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - marko

  # Proxy reverso com TLS automático (Let's Encrypt) na frente do WAHA. Publica
  # https://waha.markohome.com.br e encaminha para `waha:3000` na rede interna.
  # É o ÚNICO container com portas abertas na internet (80/443). O 80 é exigido
  # pelo desafio ACME; o 443 serve o tráfego. Requer:
  #   - registro DNS A: waha.markohome.com.br -> IP público do Hetzner
  #   - firewall do Hetzner liberando 80 e 443
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Rotaciona os logs para o disco do Hetzner não encher.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - waha
    networks:
      - marko

volumes:
  waha-sessions:
  # Persiste os certificados TLS do Caddy entre restarts (evita re-emitir e
  # bater no rate limit do Let's Encrypt).
  caddy-data:
  caddy-config:

networks:
  marko:
    driver: bridge
